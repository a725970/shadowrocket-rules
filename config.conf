# Shadowrocket 完整配置（节点保留在手机本地，本配置只含规则与策略组）
# 导入方式：Shadowrocket -> 配置 -> 右上角"+" -> 类型选 URL -> 填入本文件地址
# 本文件不含 [Proxy] 段，导入不会清除你手机里已有的 RCF-JP 节点。

[General]
loglevel = notify
dns-server = 223.5.5.5, 8.8.8.8
ipv6 = false
allow-wifi-access = false
udp-policy = disallow

[Proxy Group]
PROXY = select

[Rule]
# ===== APNs 推送强制代理（海外 App 推送依赖，必须最前）=====
DOMAIN-SUFFIX,push.apple.com,PROXY
DOMAIN-SUFFIX,courier-push-apple.com,PROXY
IP-CIDR,17.0.0.0/8,PROXY,no-resolve

# ===== Telegram 兜底 =====
DOMAIN-SUFFIX,telegram.org,PROXY
DOMAIN-SUFFIX,t.me,PROXY
DOMAIN-SUFFIX,telegram.me,PROXY
DOMAIN-SUFFIX,telegram.dog,PROXY
DOMAIN-KEYWORD,telegram,PROXY

# ===== 国内直连（抖音等不卡）=====
GEOIP,CN,DIRECT
DOMAIN-SUFFIX,douyin.com,DIRECT
DOMAIN-SUFFIX,snssdk.com,DIRECT
DOMAIN-SUFFIX,bytedance.com,DIRECT
DOMAIN-SUFFIX,bytecdn.cn,DIRECT
DOMAIN-SUFFIX,douyinstatic.com,DIRECT
DOMAIN-SUFFIX,douyinvod.com,DIRECT
DOMAIN-SUFFIX,douyinpic.com,DIRECT
DOMAIN-SUFFIX,ctlcdn.cn,DIRECT

# ===== 其他国外流量走代理 =====
FINAL,PROXY
