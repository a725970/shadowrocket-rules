# Shadowrocket 规则片段 - APNs/Telegram 强制代理 + 国内直连
# 用法：在 Shadowrocket 配置 [Rule] 段最顶部加入：
#   #!include https://raw.githubusercontent.com/a725970/shadowrocket-rules/main/rules.conf
# 更新：改完本仓库后，小火箭内 配置 -> 右上角保存/重新拉取 即可生效。

# ===== APNs 推送强制代理（放最前，否则可能被 Apple 直连规则截胡）=====
DOMAIN-SUFFIX,push.apple.com,PROXY
DOMAIN-SUFFIX,courier-push-apple.com,PROXY
DOMAIN-SUFFIX,apple-push-notifications,PROXY
IP-CIDR,17.0.0.0/8,PROXY,no-resolve

# ===== Telegram 兜底（App 后台活跃时走它自己的连接）=====
DOMAIN-SUFFIX,telegram.org,PROXY
DOMAIN-SUFFIX,t.me,PROXY
DOMAIN-SUFFIX,telegram.me,PROXY
DOMAIN-SUFFIX,telegram.dog,PROXY
DOMAIN-KEYWORD,telegram,PROXY

# ===== 国内直连（抖音等国内 App 不卡）=====
# 注：GEOIP,CN,DIRECT 需放在本片段之后、兜底 FINAL 之前
# 若你的配置里已有国内直连规则，本片段可只保留上面 APNs/Telegram 部分
